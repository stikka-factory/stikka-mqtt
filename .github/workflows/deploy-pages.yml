name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; let in-flight runs finish rather than
# racing a half-deployed site.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Checked out as true sibling directories under $GITHUB_WORKSPACE (not
      # this repo's default root, not a subdirectory of it) so the firmware
      # repo's build-firmware.sh -- written for local dev, where both repos
      # are cloned side by side -- can find this repo via its own
      # "$REPO_ROOT/../stikka-mqtt" lookup without modification.
      - name: Checkout stikka-mqtt
        uses: actions/checkout@v4
        with:
          path: stikka-mqtt

      - name: Checkout stikka-esp32
        uses: actions/checkout@v4
        with:
          repository: stikka-factory/stikka-esp32
          path: stikka-esp32

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # PlatformIO downloads the whole esp32 toolchain (compiler, framework,
      # tool packages) into ~/.platformio on first use -- a few hundred MB.
      # Cache it keyed on platformio.ini so a bump in platform/lib_deps
      # versions busts the cache instead of silently building stale.
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-${{ runner.os }}-${{ hashFiles('stikka-esp32/platformio.ini') }}
          restore-keys: |
            platformio-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      # Builds every [env:...] in platformio.ini and stages
      # firmware.bin/manifest.json/flash.json + index.json straight into
      # stikka-mqtt/frontend/public/firmware/ (see the script for the exact
      # layout) -- the same thing scripts/rebuild-all.sh does for local dev.
      # This runs before the frontend build below so `npm run build`'s copy
      # of public/ into dist/ picks up freshly-built firmware, not whatever
      # happens to be committed in this repo.
      - name: Build ESP32 firmware
        working-directory: stikka-esp32
        run: ./scripts/build-firmware.sh

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: stikka-mqtt/frontend/package-lock.json

      - name: Install dependencies
        working-directory: stikka-mqtt/frontend
        run: npm ci

      # frontend/public/config.json and frontend/public/fonts/ are gitignored
      # (per-deployment/local state, see .gitignore) so a fresh checkout has
      # neither. Recreate the minimal versions the build needs.
      #
      # mqtt.brokerURL/supabase.url/supabase.anonKey must never be empty
      # here: mqtt-api.ts's initTransport() throws synchronously on any of
      # them being falsy, which happens before the app renders anything, and
      # there's no in-app settings editor to fix it from -- this file is the
      # only place app.*/mqtt.*/supabase.* come from. The 'ws://localhost:9001'
      # fallback is just a syntactically valid placeholder (matches the local
      # dev stack) -- set the MQTT_BROKER_URL/SUPABASE_URL/SUPABASE_ANON_KEY
      # repo variables/secrets for an actually working deploy.
      - name: Write MQTT config.json
        working-directory: stikka-mqtt/frontend/public
        env:
          MQTT_BROKER_URL: ${{ vars.MQTT_BROKER_URL || 'ws://localhost:9001' }}
          MQTT_USERNAME: ${{ vars.MQTT_USERNAME }}
          MQTT_PASSWORD: ${{ secrets.MQTT_PASSWORD }}
          MQTT_CLIENT_ID_PREFIX: ${{ vars.MQTT_CLIENT_ID_PREFIX || 'stikka-web' }}
          MQTT_DISCOVERY_WAIT_MS: ${{ vars.MQTT_DISCOVERY_WAIT_MS || '1500' }}
          # Not actually secret once deployed (config.json is a public static
          # asset, see the note below) -- same caveat as MQTT_PASSWORD. Real
          # access control is Supabase's Row-Level-Security policies (see
          # supabase/schema.sql), not keeping this key hidden.
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          APP_NAME: ${{ vars.APP_NAME || 'Stikka-MQTT' }}
          APP_SUBTITLE: ${{ vars.APP_SUBTITLE || 'Kleben und kleben lassen, IoT-Style' }}
          # These two are left unset here (rather than defaulted via `||`)
          # because they're multi-line ZPL -- a GH Actions expression string
          # literal can't cleanly hold embedded newlines. Their defaults are
          # applied below as bash heredocs instead, only when empty.
          APP_ZPL_EXAMPLE: ${{ vars.APP_ZPL_EXAMPLE }}
          APP_CABLE_LABEL_ZPL_TEMPLATE: ${{ vars.APP_CABLE_LABEL_ZPL_TEMPLATE }}
          # Must be exactly "true" or "false" -- passed straight to jq --argjson,
          # which errors the build on anything else (fail fast, not silently wrong).
          APP_ZPL_RAW_ENABLED: ${{ vars.APP_ZPL_RAW_ENABLED || 'true' }}
          APP_CABLE_LABEL_ENABLED: ${{ vars.APP_CABLE_LABEL_ENABLED || 'true' }}
        run: |
          # NB: this file is served as a public static asset once deployed -
          # anyone can view it, so treat everything below as non-secret even
          # though the values are sourced from Actions vars/secrets here.
          #
          # This is the entire config every browser uses -- there's no
          # in-app settings editor, so changing app.*/mqtt.*/supabase.* means
          # changing these repo Variables/Secrets and redeploying (see CLAUDE.md).
          # $'...' (ANSI-C quoting) turns the \n escapes into real newlines
          # without needing a heredoc -- a heredoc body isn't indented like
          # the rest of this block-scalar `run: |` step, so it reads as
          # broken YAML structure rather than shell content.
          APP_ZPL_EXAMPLE=${APP_ZPL_EXAMPLE:-$'^XA\n^CFA,30\n^FO50,20\n^FDSTikka ZPL Test^FS\n\n^FO50,40\n^BQN,2,3,Q,7\n^FD1234125678^FS\n\n^FO50,120\n^BCN,45,Y,N,N,A\n^FD1234125678^FS\n\n^XZ'}
          APP_CABLE_LABEL_ZPL_TEMPLATE=${APP_CABLE_LABEL_ZPL_TEMPLATE:-$'^XA\n^FO35,365^AAB,30^FD$input1$^FS\n^FO75,365^AAB,30^FD$input2$^FS\n\n^FO120,365^AAR,30^FD$input2$^FS\n^FO160,365^AAR,30^FD$input1$^FS\n^XZ'}

          jq -n \
            --arg brokerURL "$MQTT_BROKER_URL" \
            --arg username "$MQTT_USERNAME" \
            --arg password "$MQTT_PASSWORD" \
            --arg clientIdPrefix "$MQTT_CLIENT_ID_PREFIX" \
            --argjson discoveryWaitMs "$MQTT_DISCOVERY_WAIT_MS" \
            --arg supabaseUrl "$SUPABASE_URL" \
            --arg supabaseAnonKey "$SUPABASE_ANON_KEY" \
            --arg appName "$APP_NAME" \
            --arg appSubtitle "$APP_SUBTITLE" \
            --arg zplExample "$APP_ZPL_EXAMPLE" \
            --argjson zplRawEnabled "$APP_ZPL_RAW_ENABLED" \
            --arg cableLabelZPLTemplate "$APP_CABLE_LABEL_ZPL_TEMPLATE" \
            --argjson cableLabelEnabled "$APP_CABLE_LABEL_ENABLED" \
            '{
              mode: "mqtt",
              app: {
                name: $appName,
                subtitle: $appSubtitle,
                zplExample: $zplExample,
                zplRawEnabled: $zplRawEnabled,
                cableLabelZPLTemplate: $cableLabelZPLTemplate,
                cableLabelEnabled: $cableLabelEnabled
              },
              mqtt: {
                brokerURL: $brokerURL,
                username: $username,
                password: $password,
                clientIdPrefix: $clientIdPrefix,
                discoveryWaitMs: $discoveryWaitMs
              },
              supabase: {
                url: $supabaseUrl,
                anonKey: $supabaseAnonKey
              }
            }' > config.json

      - name: Ensure fonts directory exists
        run: mkdir -p stikka-mqtt/frontend/public/fonts

      - name: Build
        working-directory: stikka-mqtt/frontend
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: stikka-mqtt/frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

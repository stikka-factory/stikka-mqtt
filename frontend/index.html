<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stikka Factory</title>
    <script>
      (function () {
        var stored = null
        try { stored = window.localStorage.getItem('stikka_theme') } catch (e) {}
        var theme = stored === 'light' || stored === 'dark'
          ? stored
          : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        document.documentElement.setAttribute('data-theme', theme)
        // Themes are separate, swappable stylesheets (see applyTheme() in
        // static-config.ts) rather than CSS rules gated on [data-theme] --
        // injected here (relative path, resolves under Vite's base) so the
        // right one is render-blocking before first paint.
        var link = document.createElement('link')
        link.id = 'theme-link'
        link.rel = 'stylesheet'
        link.href = 'themes/' + theme + '.css'
        document.head.appendChild(link)
      })()
    </script>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'></text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="https://unpkg.com/esp-web-tools@10/dist/web/install-button.js?module"></script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

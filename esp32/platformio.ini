; Env naming convention: <board>_<protocol>_<method>
;
; - protocol = what's inside the payload the firmware relays/interprets:
;     zpl -- ZPL text or pre-rendered image bytes, forwarded byte-for-byte
;            without being parsed (src/mqtt_bridge.cpp).
;     ql  -- Brother QL raster protocol bytes, built client-side (frontend's
;            zpl-image.ts) and forwarded byte-for-byte, same as zpl
;            (src/mqtt_bridge.cpp).
; - method   = how the firmware reaches the printer:
;     network  -- a plain TCP connection (src/targets/network_target.cpp)
;     serial   -- a dedicated hardware UART, not the USB/programming port
;                 (src/targets/serial_target.cpp)
;     usb      -- the board's own USB/programming port, Serial/UART0
;                 (src/targets/usb_target.cpp) -- only works if the printer
;                 accepts a plain serial/UART connection, not a real USB port
;     usb_host -- the board acts as a genuine USB host (needs a chip with a
;                 USB OTG peripheral, e.g. ESP32-S2/S3, and board circuitry
;                 that can source VBUS to a downstream device -- confirmed
;                 for esp32-s2-saola-1, not for every S2/S3 board) and talks
;                 to the printer's actual USB port via USB bulk transfers
;                 (src/targets/usb_host_target.cpp)
;
; Each env_<protocol>_<method> base section below sets the real compile
; switches (TARGET_NETWORK/TARGET_SERIAL/TARGET_USB/PROTOCOL_QL) that select
; which src/targets/*.cpp bodies actually compile in, plus PRINTER_TYPE and
; the PROTOCOL/METHOD string macros used for display only. Per-board leaf
; envs `extends` one of these bases -- see the inheritance-gotcha note right
; below before adding a new one. A new transport method or protocol gets its
; own src/targets/*.cpp (implementing the contract in src/targets/target.h,
; or branching in mqtt_bridge.cpp) plus its own env_<protocol>_<method>
; base and <board>_<protocol>_<method> leaf env(s) here -- each combination
; is a distinct firmware build, not a runtime option.
[platformio]
default_envs = esp32-s3-devkitc-1_zpl_network

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
upload_speed = 115200

lib_deps =
  knolleary/PubSubClient@^2.8
  bblanchon/ArduinoJson@^7.0.4
  adafruit/Adafruit NeoPixel@^1.12.3

build_flags =
  -D CORE_DEBUG_LEVEL=1
  -D DEFAULT_MQTT_HOST='"fb750433694544efa82d452638dea659.s1.eu.hivemq.cloud"'
  -D DEFAULT_MQTT_PORT=8883
  -D DEFAULT_MQTT_USE_TLS=true
  -D DEFAULT_MQTT_TLS_INSECURE=true
  -D DEFAULT_MQTT_USER='"stikka"'
  -D DEFAULT_MQTT_PASSWORD='"stikka123"'


; NOTE on inheritance: PlatformIO's `extends` only pulls in a key from the
; parent section if the child doesn't define that same key itself. Since
; every section below (including the board leaf envs) sets its own
; build_flags, each one must explicitly start with ${<parent>.build_flags}
; to actually chain in what its parent(s) defined -- silently omitting that
; means TARGET_*/PROTOCOL_*/PRINTER_TYPE/DEFAULT_* never reach the compiler
; for that env, even though `extends` is set.

[env_zpl_network]
extends = env
build_flags =
  ${env.build_flags}
  -D PROTOCOL='"zpl"'
  -D METHOD='"network"'
  -D TARGET_NETWORK=1
  -D PRINTER_TYPE='"zpl"'

[env_zpl_serial]
extends = env
build_flags =
  ${env.build_flags}
  -D PROTOCOL='"zpl"'
  -D METHOD='"serial"'
  -D TARGET_SERIAL=1
  -D PRINTER_TYPE='"zpl"'

[env_zpl_usb]
extends = env
build_flags =
  ${env.build_flags}
  -D PROTOCOL='"zpl"'
  -D METHOD='"usb"'
  -D TARGET_USB=1
  -D PRINTER_TYPE='"zpl"'
  ; The "usb" method reuses the board's USB/programming port (Serial/UART0)
  ; to talk to the printer, so serial debug output can't also live there --
  ; default it to the secondary UART instead (see logging.cpp).
  -D DEFAULT_DEBUG_OUTPUT_MODE='"uart"'

[env_ql_usb]
extends = env
build_flags =
  ${env.build_flags}
  -D PROTOCOL='"ql"'
  -D METHOD='"usb"'
  -D TARGET_USB=1
  -D PROTOCOL_QL=1
  -D PRINTER_TYPE='"ql"'
  -D DEFAULT_DEBUG_OUTPUT_MODE='"uart"'
  ; Brother QL's native raster resolution is fixed at 300dpi (not the
  ; general zpl-target default of 203dpi).
  -D DEFAULT_DPI=300

[env_ql_usb_host]
extends = env
build_flags =
  ${env.build_flags}
  -D PROTOCOL='"ql"'
  -D METHOD='"usb_host"'
  -D TARGET_USB_HOST=1
  -D PROTOCOL_QL=1
  -D PRINTER_TYPE='"ql"'
  -D DEFAULT_DEBUG_OUTPUT_MODE='"uart"'
  -D DEFAULT_DPI=300
  ; usb_host_install() needs exclusive control of the chip's USB OTG
  ; peripheral -- boards that auto-start native USB-CDC (Arduino's Serial
  ; object) on that same peripheral before setup() runs will bootloop
  ; fighting it for that control. Confirmed needed on esp32-s2-saola-1;
  ; harmless to set even for a board where it isn't the default.
  -D ARDUINO_USB_CDC_ON_BOOT=0

; M5Stack Atom is built on the ESP32-PICO-D4 package, which wires GPIO16/17
; internally to its embedded flash -- HardwareSerial.begin() on those pins
; (the generic DEFAULT_DEBUG_UART_TX_PIN/RX_PIN in config.h) corrupts flash
; access and bootloops the board. Every m5stack-atom env below overrides
; them to GPIO19/22 (both exposed, unused by any other default here).

[env:m5stack-atom_zpl_network]
extends = env_zpl_network
board = m5stack-atom
build_flags =
  ${env_zpl_network.build_flags}
  -D DEFAULT_LED_MODE='"neopixel"'
  -D DEFAULT_LED_PIN=27
  -D DEFAULT_LED_ORDER='"GRB"'
  -D DEFAULT_DEBUG_UART_TX_PIN=26
  -D DEFAULT_DEBUG_UART_RX_PIN=32

; [env:m5stack-atom_zpl_serial]
; extends = env_zpl_serial
; board = m5stack-atom
; build_flags =
;   ${env_zpl_serial.build_flags}
;   -D DEFAULT_LED_MODE='"neopixel"'
;   -D DEFAULT_LED_PIN=27
;   -D DEFAULT_LED_ORDER='"GRB"'
;  -D DEFAULT_DEBUG_UART_TX_PIN=26
;  -D DEFAULT_DEBUG_UART_RX_PIN=32

; Trimmed to the boards actually in active use for now (m5stack-atom_zpl_network,
; esp32-s3-devkitc-1_zpl_network, esp32-s3-devkitc-1_ql_usb_host) -- esp32-s3-devkitc-1
; is the platform going forward. Uncomment to bring one of these back.
; [env:m5stack-atom_zpl_usb]
; extends = env_zpl_usb
; board = m5stack-atom
; build_flags =
;   ${env_zpl_usb.build_flags}
;   -D DEFAULT_LED_MODE='"neopixel"'
;   -D DEFAULT_LED_PIN=27
;   -D DEFAULT_LED_ORDER='"GRB"'
;   -D DEFAULT_DEBUG_UART_TX_PIN=26
;   -D DEFAULT_DEBUG_UART_RX_PIN=32

; [env:m5stack-atom_ql_usb]
; extends = env_ql_usb
; board = m5stack-atom
; build_flags =
;   ${env_ql_usb.build_flags}
;   -D DEFAULT_LED_MODE='"neopixel"'
;   -D DEFAULT_LED_PIN=27
;   -D DEFAULT_LED_ORDER='"GRB"'
;   -D DEFAULT_DEBUG_UART_TX_PIN=26
;   -D DEFAULT_DEBUG_UART_RX_PIN=32

; ESP32-S3-DevKitC-1 (N16R8 module: 16MB quad-SPI flash + 8MB octal-SPI
; PSRAM). board_build.arduino.memory_type=qio_opi tells the Arduino core to
; wire up the octal PSRAM bus (Quad flash + Octal psram); without it the
; core never initializes PSRAM and psramFound()/mqtt_bridge.cpp's buffer
; sizing silently falls back to the small no-PSRAM default. board_upload/
; board_build.partitions override the board JSON's stock 8MB defaults to
; match this module's actual 16MB flash.
; PSRAM is what lets mqtt_bridge.cpp negotiate a much bigger MQTT receive
; buffer (see MQTT_PACKET_BUFFER_SIZE_PSRAM there) -- large reallocs above
; ESP-IDF's SPIRAM_MALLOC_ALWAYSINTERNAL threshold are automatically served
; from PSRAM once it's enabled, so most jobs fit in a single MQTT message
; and skip the frontend's chunking path entirely (see maxPayloadBytes in the
; status/capabilities JSON, read by frontend/src/mqtt-client.ts). Doesn't
; remove the hard 65535-byte ceiling (PubSubClient's bufferSize is a
; uint16_t) -- jobs bigger than that still chunk.
; Octal PSRAM on this module uses GPIO33-37 internally -- those pins aren't
; broken out for other use on this build, unlike a quad-PSRAM S3 module.
; No onboard-LED-conflict override needed here (unlike m5stack-atom's
; PICO-D4 GPIO16/17 flash conflict below) -- this module's flash/PSRAM bus
; doesn't touch GPIO16/17, so the generic DEFAULT_DEBUG_UART_TX_PIN/RX_PIN
; defaults in config.h are fine as-is.
;
; ARDUINO_USB_MODE/ARDUINO_USB_CDC_ON_BOOT control which physical port
; `Serial` means on this board -- it has two USB-C connectors, silkscreened
; "USB" (wired directly to the S3's native USB peripheral, no chip in
; between) and "UART" (wired to an onboard USB-to-UART bridge chip, the
; classic "COM port"). The two envs below split on this differently:
;
; - zpl_network (no physical printer wired to Serial at all -- method is a
;   plain TCP connection, see network_target.cpp): ARDUINO_USB_MODE=1 (the
;   board's own default, left alone) + ARDUINO_USB_CDC_ON_BOOT=1 makes
;   `Serial` the native "HWCDC" object, so logging.cpp's "usb" debug output
;   mode goes out the native "USB" port as raw USB-CDC -- not through the
;   bridge chip/"UART" port at all.
; - zpl_usb / ql_usb (TARGET_USB: `Serial` *is* the physical wire to the
;   printer, see usb_target.cpp): ARDUINO_USB_MODE=0 overrides the board
;   default so `Serial` stays real UART0, reaching the printer through the
;   bridge-chip "UART" port -- these builds already force debug output onto
;   a third, separate UART (`uart` mode, cfg.debugUartTxPin/RxPin) instead of
;   Serial, so this override doesn't affect where debug logs go, only where
;   print bytes go.

[env:esp32-s3-devkitc-1_zpl_network]
extends = env_zpl_network
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags =
  ${env_zpl_network.build_flags}
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D DEFAULT_LED_MODE='"neopixel"'
  -D DEFAULT_LED_PIN=48
  -D DEFAULT_LED_ORDER='"GRB"'

; [env:esp32-s3-devkitc-1_zpl_usb]
; extends = env_zpl_usb
; board = esp32-s3-devkitc-1
; board_build.arduino.memory_type = qio_opi
; board_upload.flash_size = 16MB
; board_build.partitions = default_16MB.csv
; build_flags =
;   ${env_zpl_usb.build_flags}
;   -D ARDUINO_USB_MODE=0
;   -D DEFAULT_LED_MODE='"neopixel"'
;   -D DEFAULT_LED_PIN=48
;   -D DEFAULT_LED_ORDER='"GRB"'

; [env:esp32-s3-devkitc-1_ql_usb]
; extends = env_ql_usb
; board = esp32-s3-devkitc-1
; board_build.arduino.memory_type = qio_opi
; board_upload.flash_size = 16MB
; board_build.partitions = default_16MB.csv
; build_flags =
;   ${env_ql_usb.build_flags}
;   -D ARDUINO_USB_MODE=0
;   -D DEFAULT_LED_MODE='"neopixel"'
;   -D DEFAULT_LED_PIN=48
;   -D DEFAULT_LED_ORDER='"GRB"'

; esp32-s2-saola-1's Micro-USB port wires D+/D- in parallel to both the
; native USB peripheral and its CP2102 USB-UART bridge chip (per Espressif's
; ESP32-S2-SAOLA-1_V1.1 schematic) -- once usb_host_install() claims that
; port for host mode, the CP2102 side (and its usual UART0/GPIO43-44 serial
; console) has no PC on the other end to talk to. Debug logging moves to
; UART1 on GPIO33(TX)/GPIO34(RX) instead -- ordinary header pins, unused
; elsewhere on this board. GPIO18 drives the board's onboard RGB LED.
; USB_HOST_SHARES_DEBUG_PORT documents that shared-connector quirk for
; logging.cpp/web_ui.cpp, which otherwise let "usb" debug mode coexist with
; usb_host on boards where the two ports are physically independent (see
; esp32-s3-devkitc-1_ql_usb_host below).
; [env:esp32-s2-saola-1_ql_usb_host]
; extends = env_ql_usb_host
; board = esp32-s2-saola-1
; build_flags =
;   ${env_ql_usb_host.build_flags}
;   -D USB_HOST_SHARES_DEBUG_PORT=1
;   -D DEFAULT_DEBUG_UART_TX_PIN=33
;   -D DEFAULT_DEBUG_UART_RX_PIN=34
;   -D DEFAULT_LED_MODE='"neopixel"'
;   -D DEFAULT_LED_PIN=18
;   -D DEFAULT_LED_ORDER='"GRB"'

; ESP32-S3-DevKitC-1's two USB-C connectors are electrically independent
; (unlike esp32-s2-saola-1 above): "USB" goes straight to the S3's native USB
; OTG peripheral, "UART" goes through its own discrete bridge chip to UART0 --
; no shared D+/D- lines, so USB_HOST_SHARES_DEBUG_PORT is deliberately *not*
; set here. usb_host_install() claiming the native peripheral for host mode
; leaves UART0/the bridge-chip "UART" port free, so debug output can stay on
; "usb" mode (DEFAULT_DEBUG_OUTPUT_MODE overridden back from env_ql_usb_host's
; "uart" default) -- Serial resolves to real UART0 here since
; ARDUINO_USB_CDC_ON_BOOT stays 0 (inherited from env_ql_usb_host, still
; required so Arduino's native-USB-CDC auto-init doesn't fight
; usb_host_install() for the OTG peripheral).
; Caveat, same one usb_host_target.cpp raises for any new board: whether this
; board's native "USB" port circuitry can actually source VBUS to power a
; downstream device in host mode isn't confirmed (only esp32-s2-saola-1 is,
; via its schematic) -- if the printer never enumerates, try a powered
; USB-OTG hub/cable that injects its own VBUS between the board and printer.
[env:esp32-s3-devkitc-1_ql_usb_host]
extends = env_ql_usb_host
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags =
  ${env_ql_usb_host.build_flags}
  -D DEFAULT_DEBUG_OUTPUT_MODE='"usb"'
  -D DEFAULT_LED_MODE='"neopixel"'
  -D DEFAULT_LED_PIN=48
  -D DEFAULT_LED_ORDER='"GRB"'


